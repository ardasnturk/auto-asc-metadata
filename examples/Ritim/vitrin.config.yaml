# Vitrin configuration — non-secret values only. Keys live in .env.
# Fill in urls, copyrightHolder and review with real values.
# research.seeds and capture.screens are filled in by Claude while the /vitrin skill runs.
app:
  bundleId: com.jastech.ritim
  project: Ritim.xcodeproj
  scheme: Ritim
  primaryLocale: en-US
  locales:
    - en-US
    - tr
storefronts:
  - us
  - tr
urls:
  support: https://example.com/support
  privacy: https://example.com/privacy
copyrightHolder: JASTech
review:
  firstName: ""
  lastName: ""
  phone: ""
  email: ""
research:
  seeds:
    en-US:
      - habit tracker
      - daily habits
      - streak tracker
      - routine planner
      - habit calendar
      - goal tracker
    tr:
      - alışkanlık takibi
      - alışkanlık
      - günlük rutin
      - hedef takip
      - seri takibi
      - rutin planlayıcı
  competitors: 15
  candidates: 40
  limit: 50
  cacheHours: 24
  reviewsPerApp: 50
  ocr: true
targets:
  # Ritim predates the Xcode 27.1 Duo heuristic; keep its Duo sets on for end-to-end runs.
  enable: [ duo-outer, duo-inner ]
  disable: []
capture:
  mode: html
  configuration: Debug
  appearance: light
  # HTML recreations in metadata/screens/ (written from these views); the -done/-more/add states are what the
  # App Preview flows change to after a tap or a scroll.
  screens:
    - id: home
      source: [ Ritim/Views/HomeView.swift, Ritim/Views/Components/Components.swift, Ritim/App/RitimApp.swift ]
    - id: home-7
      source: [ Ritim/Views/HomeView.swift ]
    - id: home-done
      source: [ Ritim/Views/HomeView.swift ]
    - id: stats
      source: [ Ritim/Views/StatsView.swift, Ritim/Views/Components/Components.swift ]
    - id: stats-more
      source: [ Ritim/Views/StatsView.swift ]
    - id: detail
      source: [ Ritim/Views/HabitDetailView.swift, Ritim/Views/Components/Components.swift ]
    - id: reminders
      source: [ Ritim/Views/RemindersView.swift ]
    - id: add
      source: [ Ritim/Views/AddHabitView.swift, Ritim/Models/HabitStyle.swift ]
  recordings: []
  simulators: {}
video:
  enabled: true
  # Header/search creatives ship as images here; 4K loop videos would add ~100 MB to the example.
  loops: false
upload:
  uploader: deliver
  platform: ios
selection:
  platforms: [ ios ]
  assets: [ metadata, screenshots, previews, creatives, events ]
  targets: [ iphone-6.3, ipad-13, preview-iphone, header, search, event-card, event-detail ]
ui:
  language: en
# Example project: the store outputs in metadata/ are committed so the repository shows a whole run.
retention:
  commit: true
